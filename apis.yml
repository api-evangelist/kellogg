aid: kellogg
name: Kellogg
description: >-
  The Kellogg Company is a historic American multinational food manufacturer
  founded in 1906 by W.K. Kellogg in Battle Creek, Michigan. In 2023 the
  company split into two independent public companies: WK Kellogg Co, which
  retained the North American cereal business (Frosted Flakes, Rice Krispies,
  Special K, Corn Flakes, Raisin Bran), and Kellanova, which took the global
  snacks business and international cereal portfolio (Pringles, Cheez-It,
  Pop-Tarts, Eggo, RXBAR). This profile tracks the legacy Kellogg corporate
  identity and links forward to the two successor entities.
